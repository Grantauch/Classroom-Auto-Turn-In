name: Build Windows Release Candidate

on:
  workflow_dispatch:
  push:
    branches:
      - 'feature/goclassroom-review-fixes-v0.9.27'
      - 'work/goclassroom-v1-hardening-20260923'
    tags:
      - 'v0.9.28*'
      - 'v0.9.29*'
      - 'v1.*'

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pinned Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.19.0'
          cache: 'npm'

      - name: Require committed dependency lock
        shell: pwsh
        run: |
          if (-not (Test-Path package-lock.json)) {
            throw "package-lock.json is required for v0.9.29 and 1.x release builds. Run PREPARE-RC-LOCKFILE.bat, retain the lockfile, and commit/package it before release."
          }

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Run release-readiness checks
        run: npm run check:release-ready

      - name: Run Chrome/Edge DOM fixture checks
        run: npm run check:dom

      - name: Verify silent background browser mode
        run: npm run check:browser

      - name: Run end-to-end checks against the offline Classroom/Drive simulator
        run: npm run check:e2e
        env:
          CATI_E2E_HEADLESS: "1"

      - name: Build teacher installer
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          CSC_LINK: ""
          CSC_KEY_PASSWORD: ""
          WIN_CSC_LINK: ""
          WIN_CSC_KEY_PASSWORD: ""

      - name: Validate actual install, packaged self-test, uninstall cleanup, and reinstall
        shell: pwsh
        run: ./scripts/windows-installed-validation.ps1

      - name: Write release hashes
        shell: pwsh
        run: ./scripts/Write-ReleaseHashes.ps1

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: GoClassroom-v0.9.29-Windows
          path: |
            dist/Classroom-Auto-Turn-In-Setup-*.exe
            dist/*.blockmap
            dist/SHA256SUMS.txt
          if-no-files-found: error

  # A version tag, or a manual run of this workflow on main, also publishes the
  # tested installer as a GitHub Release (tagged v<package version>), so
  # teachers download it from one permanent link without a GitHub account:
  # https://github.com/Grantauch/Classroom-Auto-Turn-In/releases/latest/download/GoClassroom-Setup.exe
  publish-release:
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the tested installer
        uses: actions/download-artifact@v4
        with:
          name: GoClassroom-v0.9.29-Windows
          path: dist

      - name: Add a version-free copy for the permanent link
        id: installer
        run: |
          set -euo pipefail
          installer=$(ls dist/Classroom-Auto-Turn-In-Setup-*.exe | head -n 1)
          version=$(basename "$installer" | sed -E 's/^Classroom-Auto-Turn-In-Setup-([0-9][0-9.]*[0-9])-.*$/\1/')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          cp "$installer" dist/GoClassroom-Setup.exe
          ls -l dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.installer.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: GoClassroom v${{ steps.installer.outputs.version }}
          body: |
            Windows installer for GoClassroom. Download **GoClassroom-Setup.exe** and run it.
            Windows may say "Windows protected your PC" because the installer is not code-signed: click **More info → Run anyway**.
            SHA256SUMS.txt lists the checksum of the versioned installer.
          files: |
            dist/GoClassroom-Setup.exe
            dist/Classroom-Auto-Turn-In-Setup-*.exe
            dist/SHA256SUMS.txt
          fail_on_unmatched_files: true
